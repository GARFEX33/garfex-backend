          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/supplier-products/{id}/mapping/resolve-conflict:
    post:
      summary: Resolve a supplier-product identity conflict
      description: >-
        Selects the canonical active Resource only when the expected current
        Resource and mapping revision match. Reread after every result; do not
        retry an ambiguous failure blindly.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveMappingConflictRequest' }
