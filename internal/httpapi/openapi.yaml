          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: Conditional transition failed (`STALE_MAPPING_REVISION`, `SUPPLIER_PRODUCT_TARGET_CONFLICT`, `INVALID_MAPPING_TRANSITION`, or `INTEGRITY_CONFLICT`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: Selected Resource cannot be used (`RESOURCE_INACTIVE` or `VALIDATION`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/purchase-lines/{lineId}/resolve:
    post:
      summary: Resolve one purchase line
      description: >-
        Resolves one line transactionally through its SupplierProduct. The
        expected SupplierProduct id and mapping revision are required snapshot
        fields and may each be null for an unassociated line. A non-empty
        commercialSupplierSku applies only when expectedSupplierProductId is
        null; it creates or reuses the commercial identity. The XML
        supplierSku is immutable evidence and is never changed by this action.
        After success, conflict, or an ambiguous failure, reread the line and
        workbench; do not retry blindly.
      parameters:
        - name: lineId
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolvePurchaseLineRequest' }
      responses:
        '200':
          description: Authoritative line, SupplierProduct, and commercial identity disposition.
          content: { application/json: { schema: { $ref: '#/components/schemas/ResolvePurchaseLineResponse' } } }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404':
          description: Purchase line or selected Resource was not found (`PURCHASE_LINE_NOT_FOUND`, `RESOURCE_NOT_FOUND`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: Authoritative state or snapshot conflict (`PURCHASE_LINE_STATE_CONFLICT`, `STALE_RESOLUTION_REVISION`, `STALE_MAPPING_REVISION`, `SUPPLIER_PRODUCT_TARGET_CONFLICT`, `INVALID_MAPPING_TRANSITION`, or `INTEGRITY_CONFLICT`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: Resolution validation failed (`COMMERCIAL_SUPPLIER_SKU_REQUIRED`, `COMMERCIAL_SUPPLIER_SKU_FORBIDDEN`, `RESOURCE_INACTIVE`, or `VALIDATION`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/purchase-lines/{lineId}/resolution-override:
    post:
      summary: Set a purchase-line resolution override
      description: >-
        Sets the line-specific override under the expected resolution revision.
        Only NONE, NO_APLICA, and CONFLICTO are accepted. Reread after success,
        conflict, or ambiguous failure; do not retry blindly.
      parameters:
        - name: lineId
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolutionOverrideRequest' }
      responses:
        '200':
          description: Authoritative PurchaseLine after the transition.
          content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseLine' } } }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404':
          description: Purchase line was not found (`PURCHASE_LINE_NOT_FOUND`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: Resolution state or revision conflict (`PURCHASE_LINE_STATE_CONFLICT`, `STALE_RESOLUTION_REVISION`, or `INTEGRITY_CONFLICT`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: Override validation failed (`VALIDATION`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/resources/{id}/purchase-history:
    get:
      summary: List a Resource Master entry's purchase history
      description: Which suppliers and supplier products have sold this resource, when, at what price and quantity, in what currency, and from which branch and source document. Most recent purchase first.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Purchase line history page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseLineHistoryPage'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '500': { $ref: '#/components/responses/Internal' }
  /openapi.yaml:
    get:
      summary: OpenAPI document
      responses:
        '200':
          description: Embedded OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string
  /docs:
    get:
      summary: API reference
      description: Serves a Scalar API-reference page for this OpenAPI document.
      responses:
        '200':
          description: HTML API-reference page
          content:
            text/html:
              schema:
                type: string
components:
  responses:
    InvalidArgument: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Requested resource was not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Request conflicts with current state, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unprocessable: { description: Request failed validation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unavailable: { description: Service is temporarily unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Internal: { description: Internal server error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    CatalogRecord:
      type: object
      required: [kind, id, revision, active, values, rules]
      properties:
        kind: { type: string }
        id: { type: string, description: Decimal integer identifier, pattern: '^(?:0|-?[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        revision: { type: string, description: Decimal unsigned revision, pattern: '^(?:0|[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        active: { type: boolean }
        values: { type: object, additionalProperties: { $ref: '#/components/schemas/CatalogValue' } }
        rules: { type: array, items: { $ref: '#/components/schemas/ApplicabilityRule' } }
    CatalogPage:
      type: object
      required: [records, hasPrevious, hasNext]
      properties:
        records: { type: array, items: { $ref: '#/components/schemas/CatalogRecord' } }
        hasPrevious: { type: boolean }
        hasNext: { type: boolean }
    ApplicabilityRule:
      type: object
      required: [attributeCode, equals, mode, identityParticipates, notApplicable, active]
      properties:
        attributeCode: { type: string }
        equals: { $ref: '#/components/schemas/CatalogValue' }
        mode: { type: string }
        identityParticipates: { type: boolean }
        notApplicable: { type: boolean }
        active: { type: boolean }
    CatalogValue:
      oneOf:
        - { $ref: '#/components/schemas/CatalogTextValue' }
        - { $ref: '#/components/schemas/CatalogCodeValue' }
        - { $ref: '#/components/schemas/CatalogBooleanValue' }
        - { $ref: '#/components/schemas/CatalogIntegerValue' }
        - { $ref: '#/components/schemas/CatalogDecimalValue' }
        - { $ref: '#/components/schemas/CatalogQuantityValue' }
        - { $ref: '#/components/schemas/CatalogReferenceValue' }
        - { $ref: '#/components/schemas/CatalogEnumValue' }
        - { $ref: '#/components/schemas/CatalogStringListValue' }
        - { $ref: '#/components/schemas/CatalogControlledOptionValue' }
        - { $ref: '#/components/schemas/CatalogNotApplicableValue' }
      discriminator:
        propertyName: kind
        mapping:
          TEXT: '#/components/schemas/CatalogTextValue'
          CODE: '#/components/schemas/CatalogCodeValue'
          BOOLEAN: '#/components/schemas/CatalogBooleanValue'
          INTEGER: '#/components/schemas/CatalogIntegerValue'
          DECIMAL: '#/components/schemas/CatalogDecimalValue'
          QUANTITY: '#/components/schemas/CatalogQuantityValue'
          REFERENCE: '#/components/schemas/CatalogReferenceValue'
          ENUM: '#/components/schemas/CatalogEnumValue'
          STRING_LIST: '#/components/schemas/CatalogStringListValue'
          CONTROLLED_OPTION: '#/components/schemas/CatalogControlledOptionValue'
          NOT_APPLICABLE: '#/components/schemas/CatalogNotApplicableValue'
    CatalogTextValue:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties: { kind: { type: string, enum: [TEXT] }, value: { type: string } }
    CatalogCodeValue:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties: { kind: { type: string, enum: [CODE] }, value: { type: string } }
    CatalogBooleanValue:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties: { kind: { type: string, enum: [BOOLEAN] }, value: { type: boolean } }
    CatalogIntegerValue:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties: { kind: { type: string, enum: [INTEGER] }, value: { type: string, description: Decimal integer, pattern: '^(?:0|-?[1-9][0-9]*)$', not: { pattern: '[\r\n]' } } }
    CatalogDecimalValue:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties: { kind: { type: string, enum: [DECIMAL] }, value: { type: string, pattern: '^(?:0|-?(?:[1-9][0-9]*|(?:0|[1-9][0-9]*)\.[0-9]*[1-9]))$', not: { pattern: '[\r\n]' } } }
    CatalogQuantityValue:
      type: object
      additionalProperties: false
      required: [kind, value, unitCode]
      properties: { kind: { type: string, enum: [QUANTITY] }, value: { type: string, pattern: '^(?:0|-?(?:[1-9][0-9]*|(?:0|[1-9][0-9]*)\.[0-9]*[1-9]))$', not: { pattern: '[\r\n]' } }, unitCode: { type: string } }
    CatalogReferenceValue:
      type: object
      additionalProperties: false
      required: [kind, reference]
      properties: { kind: { type: string, enum: [REFERENCE] }, reference: { $ref: '#/components/schemas/CatalogReference' } }
    CatalogReference:
      type: object
      additionalProperties: false
      required: [kind, id, code]
      properties:
        kind: { type: string }
        id:
          type: string
          pattern: '^(?:0|-?[1-9][0-9]*)$'
          not: { pattern: '[\r\n]' }
          description: >-
            Decimal integer identifier. In a response this is the referenced
            record's real id. In a create/update request body it MUST be "0":
            the server resolves the reference by code, and a non-zero id is
            rejected as invalid (references are addressed by natural code on
            write, never by id).
        code: { type: string }
    CatalogEnumValue:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties: { kind: { type: string, enum: [ENUM] }, value: { type: string } }
    CatalogStringListValue:
      type: object
      additionalProperties: false
      required: [kind, values]
      properties: { kind: { type: string, enum: [STRING_LIST] }, values: { type: array, items: { type: string } } }
    CatalogControlledOptionValue:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties: { kind: { type: string, enum: [CONTROLLED_OPTION] }, value: { type: string } }
    CatalogNotApplicableValue:
      type: object
      additionalProperties: false
      required: [kind]
      properties: { kind: { type: string, enum: [NOT_APPLICABLE] } }
    CatalogCreateRequest:
      type: object
      additionalProperties: false
      required: [actor, values]
      properties:
        actor: { type: string }
        active: { type: boolean }
        values: { type: object, additionalProperties: { $ref: '#/components/schemas/CatalogValue' } }
        rules: { type: array, items: { $ref: '#/components/schemas/ApplicabilityRule' }, description: 'For kind APLICABILIDAD this field is required and must be present as an array even when the binding is non-conditional: omitting it fails with "applicability rules are omitted", and sending a non-empty array on a non-conditional binding fails with "non-conditional applicability has rules". Send an explicit empty array ([]) for the common non-conditional case.' }
    CatalogUpdateRequest:
      type: object
      additionalProperties: false
      required: [actor, expectedRevision, values]
      properties:
        actor: { type: string }
        expectedRevision: { type: string, description: Decimal unsigned revision, pattern: '^(?:0|[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        active: { type: boolean }
        values: { type: object, additionalProperties: { $ref: '#/components/schemas/CatalogValue' } }
        rules: { type: array, items: { $ref: '#/components/schemas/ApplicabilityRule' }, description: 'For kind APLICABILIDAD this field is required and must be present as an array even when the binding is non-conditional: omitting it fails with "applicability rules are omitted", and sending a non-empty array on a non-conditional binding fails with "non-conditional applicability has rules". Send an explicit empty array ([]) for the common non-conditional case.' }
    CatalogLifecycleRequest:
      type: object
      additionalProperties: false
      required: [actor, expectedRevision]
      properties:
        actor: { type: string }
        expectedRevision: { type: string, description: Decimal unsigned revision, pattern: '^(?:0|[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
    CatalogDescriptorsResponse:
      type: object
      required: [descriptors]
      properties: { descriptors: { type: array, items: { $ref: '#/components/schemas/CatalogDescriptor' } } }
    ActiveClassesResponse:
      type: object
      required: [records]
      properties: { records: { type: array, items: { $ref: '#/components/schemas/CatalogRecord' } } }
    CatalogDescriptor:
      type: object
      required: [kind, singular, plural, fields, identityFields, parentKind, parentField]
      properties:
        kind: { type: string }
        singular: { type: string }
        plural: { type: string }
        fields: { type: array, items: { $ref: '#/components/schemas/FieldDescriptor' } }
        identityFields: { type: array, items: { type: string } }
        parentKind: { type: string }
        parentField: { type: string }
    FieldDescriptor:
      type: object
      required: [name, label, kind, required, refKind, refScopedBy, allowCreate, enumValues]
      properties:
        name: { type: string }
        label: { type: string }
        kind: { type: string }
        required: { type: boolean }
        refKind: { type: string }
        refScopedBy: { type: array, items: { type: string } }
        allowCreate:
          type: boolean
          description: >-
            True on a reference field (refKind set) that should be presented
            as search-existing-first, create-as-fallback — never a plain
            "create new" form by default. Always false, and meaningless, on a
            non-reference field.
        enumValues: { type: array, items: { $ref: '#/components/schemas/EnumValue' } }
    EnumValue:
      type: object
      required: [value, label]
      properties: { value: { type: string }, label: { type: string } }
    SupplierCFDIPreview:
      type: object
      additionalProperties: false
      required: [draft, existing]
      properties:
        draft: { $ref: '#/components/schemas/CFDISupplierDraft' }
        existing:
          nullable: true
          description: The supplier already owning the RFC (active or inactive); null when the RFC is new.
          allOf:
            - $ref: '#/components/schemas/Supplier'
    CFDIParseResponse:
      type: object
      additionalProperties: false
      required: [invoice, supplierDraft]
      properties:
        invoice: { $ref: '#/components/schemas/CFDIInvoice' }
        supplierDraft: { $ref: '#/components/schemas/CFDISupplierDraft' }
    CFDISupplierDraft:
      type: object
      additionalProperties: false
      required: [taxIdentifier, legalName, taxRegime]
      description: Emisor data shaped like a supplier create request. RFC is trimmed and upper-cased.
      properties:
        taxIdentifier: { type: string }
        legalName: { type: string }
        taxRegime: { type: string, description: "SAT regimen fiscal code, such as 601. Informational only; suppliers have no such field." }
    CFDIInvoice:
      type: object
      additionalProperties: false
      description: >-
        Amounts, quantities and rates are exact decimal strings as written in
        the XML. Absent values are empty strings. Dates have no zone
        (`YYYY-MM-DDThh:mm:ss`).
      required:
        - version
        - series
        - folio
        - issuedAt
        - seal
        - paymentForm
        - certificateNumber
        - certificate
        - paymentConditions
        - subtotal
        - discount
        - currency
        - exchangeRate
        - total
        - voucherType
        - export
        - paymentMethod
        - issuePlace
        - confirmation
        - related
        - issuer
        - receiver
        - concepts
        - taxes
        - stamp
      properties:
        version: { type: string }
        series: { type: string }
        folio: { type: string }
        issuedAt: { type: string }
        seal: { type: string }
        paymentForm: { type: string }
        certificateNumber: { type: string }
        certificate: { type: string }
        paymentConditions: { type: string }
        subtotal: { type: string }
        discount: { type: string }
        currency: { type: string }
        exchangeRate: { type: string }
        total: { type: string }
        voucherType: { type: string }
        export: { type: string }
        paymentMethod: { type: string }
        issuePlace: { type: string }
        confirmation: { type: string }
        related:
          type: array
          items: { $ref: '#/components/schemas/CFDIRelated' }
        issuer: { $ref: '#/components/schemas/CFDIIssuer' }
        receiver: { $ref: '#/components/schemas/CFDIReceiver' }
        concepts:
          type: array
          items: { $ref: '#/components/schemas/CFDIConcept' }
        taxes: { $ref: '#/components/schemas/CFDITaxes' }
        stamp:
          nullable: true
          description: The SAT TimbreFiscalDigital complement; null when the voucher has none.
          allOf:
            - $ref: '#/components/schemas/CFDIStamp'
    CFDIRelated:
      type: object
      additionalProperties: false
      required: [relationType, uuids]
      properties:
        relationType: { type: string }
        uuids:
          type: array
          items: { type: string }
    CFDIIssuer:
      type: object
      additionalProperties: false
      required: [taxIdentifier, name, taxRegime]
      properties:
        taxIdentifier: { type: string }
        name: { type: string }
        taxRegime: { type: string }
    CFDIReceiver:
      type: object
      additionalProperties: false
      required: [taxIdentifier, name, postalCode, taxRegime, cfdiUse, foreignResidence, foreignTaxIdentifier]
      properties:
        taxIdentifier: { type: string }
        name: { type: string }
        postalCode: { type: string }
        taxRegime: { type: string }
        cfdiUse: { type: string }
        foreignResidence: { type: string }
        foreignTaxIdentifier: { type: string }
    CFDIConcept:
      type: object
      additionalProperties: false
      required: [productServiceCode, itemNumber, quantity, unitCode, unit, description, unitPrice, amount, discount, taxObject, taxes]
      properties:
        productServiceCode: { type: string }
        itemNumber: { type: string, description: "The issuer product code (NoIdentificacion)." }
        quantity: { type: string }
        unitCode: { type: string }
        unit: { type: string }
        description: { type: string }
        unitPrice: { type: string }
        amount: { type: string }
        discount: { type: string }
        taxObject: { type: string }
        taxes:
          type: object
          additionalProperties: false
          required: [transferred, withheld]
          properties:
            transferred:
              type: array
              items: { $ref: '#/components/schemas/CFDITax' }
            withheld:
              type: array
              items: { $ref: '#/components/schemas/CFDITax' }
    CFDITaxes:
      type: object
      additionalProperties: false
      required: [totalTransferred, totalWithheld, transferred, withheld]
      properties:
        totalTransferred: { type: string }
        totalWithheld: { type: string }
        transferred:
          type: array
          items: { $ref: '#/components/schemas/CFDITax' }
        withheld:
          type: array
          items: { $ref: '#/components/schemas/CFDITax' }
    CFDITax:
      type: object
      additionalProperties: false
      required: [base, tax, factorType, rate, amount]
      description: Voucher-level withholdings only carry `tax` and `amount`.
      properties:
        base: { type: string }
        tax: { type: string, description: "SAT tax code: 001 ISR, 002 IVA, 003 IEPS." }
        factorType: { type: string }
        rate: { type: string }
        amount: { type: string }
    CFDIStamp:
      type: object
      additionalProperties: false
      required: [version, uuid, stampedAt, providerTaxIdentifier, legend, cfdSeal, satCertificateNumber, satSeal]
      properties:
        version: { type: string }
        uuid: { type: string, description: Upper-cased. }
        stampedAt: { type: string }
        providerTaxIdentifier: { type: string }
        legend: { type: string }
        cfdSeal: { type: string }
        satCertificateNumber: { type: string }
        satSeal: { type: string }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          description: 'Generic, sanitized classification of the failure (e.g. "invalid request", "validation failed").'
        code:
          type: string
          description: >-
            Stable, machine-readable reason code, safe to switch on: distinct
            outcomes that read the same generic "conflict" error (e.g. an
            expected-revision mismatch, a still-active record, or a record
            still in use) are always distinguishable here even when error is
            identical. Absent only when the failure never reached Core (e.g.
            an HTTP method mismatch).
          enum:
            - INVALID_ARGUMENT
            - NOT_FOUND
            - DUPLICATE
            - INVALID_REFERENCE
            - VALIDATION
            - INTEGRITY
            - IDENTITY_CONFLICT
            - INVALID_LIFECYCLE
            - REACTIVATION_IMPOSSIBLE
            - INVALID_CATALOG
            - IN_USE
            - IMMUTABLE_CODE
            - CONFLICT
            - UNAVAILABLE
            - INTERNAL
            - PURCHASE_LINE_NOT_FOUND
            - RESOURCE_NOT_FOUND
            - RESOURCE_INACTIVE
            - COMMERCIAL_SUPPLIER_SKU_REQUIRED
            - COMMERCIAL_SUPPLIER_SKU_FORBIDDEN
            - PURCHASE_LINE_STATE_CONFLICT
            - STALE_RESOLUTION_REVISION
            - STALE_MAPPING_REVISION
            - SUPPLIER_PRODUCT_TARGET_CONFLICT
            - INVALID_MAPPING_TRANSITION
            - INTEGRITY_CONFLICT
        detail:
          type: string
          description: >-
            The specific reason, present only when error is "invalid request" or
            "validation failed". Absent for every other error (not found, conflict,
            unavailable, internal server error), which never expose internal detail.
    SupplierCreateRequest:
      type: object
      additionalProperties: false
      required: [actor]
      properties:
        actor: { type: string }
        tradeName: { type: string }
        legalName: { type: string }
        taxIdentifier: { type: string }
        website: { type: string }
        notes: { type: string }
    SupplierUpdateRequest:
      type: object
      additionalProperties: false
      required: [actor]
      properties:
        actor: { type: string }
        tradeName: { type: string }
        legalName: { type: string }
        taxIdentifier: { type: string }
        website: { type: string }
        notes: { type: string }
    Supplier:
      type: object
      additionalProperties: false
      required: [id, tradeName, legalName, taxIdentifier, website, notes, active, createdAt, updatedAt]
      properties:
        id: { type: string, description: Decimal integer identifier, pattern: '^(?:0|-?[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        tradeName: { type: string }
        legalName: { type: string }
        taxIdentifier: { type: string }
        website: { type: string }
        notes: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SupplierPage:
      type: object
      additionalProperties: false
      required: [suppliers, hasPrevious, hasNext]
      properties:
        suppliers: { type: array, items: { $ref: '#/components/schemas/Supplier' } }
        hasPrevious: { type: boolean }
        hasNext: { type: boolean }
    Branch:
      type: object
      additionalProperties: false
      required: [id, supplierId, name, reference, city, state, country, address, generalPhone, generalEmail, notes, active, createdAt, updatedAt]
      properties:
        id: { type: string, description: Decimal integer identifier, pattern: '^(?:0|-?[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        supplierId: { type: string, description: Decimal integer identifier, pattern: '^(?:0|-?[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        name: { type: string }
        reference: { type: string }
        city: { type: string }
        state: { type: string }
        country: { type: string }
        address: { type: string }
        generalPhone: { type: string }
        generalEmail: { type: string }
        notes: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BranchPage:
      type: object
      additionalProperties: false
      required: [branches, hasPrevious, hasNext]
      properties:
        branches: { type: array, items: { $ref: '#/components/schemas/Branch' } }
        hasPrevious: { type: boolean }
        hasNext: { type: boolean }
    Contact:
      type: object
      additionalProperties: false
      required: [id, supplierId, name, role, phone, mobile, email, notes, active, createdAt, updatedAt]
      properties:
        id: { type: string, description: Decimal integer identifier, pattern: '^(?:0|-?[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        supplierId: { type: string, description: Decimal integer identifier, pattern: '^(?:0|-?[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        branchId: { type: string, description: Decimal integer identifier; omitted when the contact has no branch, pattern: '^(?:0|-?[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        name: { type: string }
        role: { type: string }
        phone: { type: string }
        mobile: { type: string }
        email: { type: string }
        notes: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ContactPage:
      type: object
      additionalProperties: false
      required: [contacts, hasPrevious, hasNext]
      properties:
        contacts: { type: array, items: { $ref: '#/components/schemas/Contact' } }
        hasPrevious: { type: boolean }
        hasNext: { type: boolean }
    ResourceScope:
      type: object
      additionalProperties: false
      required: [classCode, familyCode, typeCode]
      properties:
        classCode: { type: string }
        familyCode: { type: string }
        typeCode: { type: string }
    ResourceAttribute:
      type: object
      additionalProperties: false
      required: [code, value]
      properties:
        code: { type: string }
        value: { $ref: '#/components/schemas/CatalogValue' }
    ResourceCreateRequest:
      type: object
      additionalProperties: false
      required: [actor, scope, naturalUnit, attributes]
      properties:
        actor: { type: string }
