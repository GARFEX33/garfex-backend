openapi: 3.0.3
info:
  title: Garfex API
  version: 0.1.0
  description: Public operational, API-reference, catalog-descriptor, catalog-list, and catalog-detail endpoints.
paths:
  /healthz:
    get:
      summary: Liveness probe
      description: Reports that this HTTP process is running. It does not check database or dependency readiness.
      responses:
        '200':
          description: Process is live
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /v1/catalog/descriptors:
    get:
      summary: List catalog descriptors
      description: Returns Core's dynamic catalog metadata. It does not list catalog records.
      responses:
        '200':
          description: Catalog descriptors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDescriptorsResponse'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/catalog/classes:
    get:
      summary: List active classes
      description: Returns every active CLASE record, unpaginated.
      responses:
        '200':
          description: Active CLASE records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveClassesResponse'
        '500': { $ref: '#/components/responses/Internal' }
  /v1/catalog/{kind}:
    get:
      summary: List catalog records
      description: Returns a page of catalog records for one kind.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, ALL], default: ACTIVE }
        - name: text
          in: query
          schema: { type: string }
        - name: classCode
          in: query
          description: Scopes results to records whose parent CLASE has this code (e.g. listing FAMILIA or TIPO under one class). Silently ignored by a kind whose descriptor has no class parent field.
          schema: { type: string }
        - name: familyCode
          in: query
          description: Scopes results to records whose parent FAMILIA has this code (e.g. listing TIPO under one family). Silently ignored by a kind whose descriptor has no family parent field.
          schema: { type: string }
        - name: typeCode
          in: query
          description: Scopes results to records whose parent TIPO has this code (e.g. listing APLICABILIDAD or PRESENTACION under one type). Silently ignored by a kind whose descriptor has no type parent field.
          schema: { type: string }
        - name: optionSetCode
          in: query
          description: Scopes results to records whose parent CONJUNTO_OPCIONES has this code (e.g. listing OPCION under one option set). Silently ignored by a kind whose descriptor has no option-set parent field.
          schema: { type: string }
        - name: characteristicCode
          in: query
          description: Scopes results to records whose parent CARACTERISTICA has this code (e.g. listing APLICABILIDAD or OPCION under one characteristic). Silently ignored by a kind whose descriptor has no characteristic parent field.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Catalog records page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPage'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      summary: Create a catalog record
      description: Creates one catalog record of the requested kind.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogCreateRequest'
      responses:
        '201':
          description: Created catalog record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRecord'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/catalog/{kind}/{id}:
    get:
      summary: Get a catalog record
      description: Returns one catalog record by kind and strict positive decimal identifier.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      responses:
        '200':
          description: Catalog record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRecord'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
    put:
      summary: Update a catalog record
      description: Replaces one existing catalog record's content under optimistic concurrency.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogUpdateRequest'
      responses:
        '200':
          description: Updated catalog record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRecord'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
    delete:
      summary: Permanently delete a catalog record
      description: Irreversibly removes one existing catalog record under optimistic concurrency. Unlike deactivate, there is no idempotent no-op target and no record left to read back. The record must already be inactive (deactivate it first) — deleting an active record fails with 409 Conflict.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogLifecycleRequest'
      responses:
        '204':
          description: Catalog record permanently deleted
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/catalog/{kind}/{id}/deactivate:
    post:
      summary: Deactivate a catalog record
      description: Deactivates one existing catalog record under optimistic concurrency.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogLifecycleRequest'
      responses:
        '200':
          description: Deactivated catalog record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRecord'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/catalog/{kind}/{id}/reactivate:
    post:
      summary: Reactivate a catalog record
      description: Reactivates one existing catalog record under optimistic concurrency.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogLifecycleRequest'
      responses:
        '200':
          description: Reactivated catalog record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRecord'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/suppliers:
    get:
      summary: Search suppliers
      description: Returns a page of suppliers matching the query.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, ALL], default: ACTIVE }
        - name: text
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Supplier page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierPage'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      summary: Create a supplier
      description: Creates one supplier. Created suppliers are always active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierCreateRequest'
      responses:
        '201':
          description: Created supplier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/suppliers/from-cfdi/preview:
    post:
      summary: Preview creating a supplier from a CFDI XML
      description: >-
        Reads a CFDI 4.0 voucher (multipart `file` field or raw XML body) and
        returns the supplier draft built from its Emisor plus the supplier that
        already owns that RFC, active or inactive, or null when the RFC is new.
        Read-only: nothing is created. To create, call `POST /v1/suppliers`
        with the draft; the unique RFC constraint stays authoritative if
        another request creates the supplier in between.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The CFDI XML file.
          application/xml:
            schema:
              type: string
              description: The raw CFDI XML document.
      responses:
        '200':
          description: Draft and existing supplier, if any
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierCFDIPreview'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '422':
          description: >-
            The file is not a usable CFDI 4.0. `code` is one of INVALID_XML,
            NOT_CFDI, UNSUPPORTED_VERSION, INVALID_CFDI.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/suppliers/{id}:
    get:
      summary: Get a supplier
      description: Returns one supplier by strict positive decimal identifier.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      responses:
        '200':
          description: Supplier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    put:
      summary: Update a supplier
      description: Fully replaces one existing supplier's content. A field left empty clears the stored value.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierUpdateRequest'
      responses:
        '200':
          description: Updated supplier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/suppliers/{id}/branches:
    get:
      summary: List branches
      description: Returns a page of branches belonging to one supplier.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
        - name: scope
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, ALL], default: ACTIVE }
        - name: text
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Branch page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchPage'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/suppliers/{id}/branches/{branchId}:
    get:
      summary: Get a branch
      description: Returns one branch belonging to one supplier.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
        - name: branchId
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      responses:
        '200':
          description: Branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/suppliers/{id}/contacts:
    get:
      summary: List contacts
      description: Returns a page of contacts belonging to one supplier, optionally narrowed to one branch.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
        - name: scope
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, ALL], default: ACTIVE }
        - name: text
          in: query
          schema: { type: string }
        - name: branchId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Contact page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactPage'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/suppliers/{id}/contacts/{contactId}:
    get:
      summary: Get a contact
      description: Returns one contact belonging to one supplier.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
        - name: contactId
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/resources:
    get:
      summary: Search resources
      description: Returns a page of resources matching the query.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, ALL], default: ACTIVE }
        - name: text
          in: query
          schema: { type: string }
        - name: classCode
          in: query
          schema: { type: string }
        - name: familyCode
          in: query
          schema: { type: string }
        - name: typeCode
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Resource page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePage'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      summary: Create a resource
      description: Creates one resource under a class/family/type scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceCreateRequest'
      responses:
        '201':
          description: Created resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/resources/{classCode}/{identityV1}:
    get:
      summary: Get a resource
      description: Returns one resource by class code and durable identity-v1.
      parameters:
        - name: classCode
          in: path
          required: true
          schema: { type: string }
        - name: identityV1
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/resources/{classCode}/{identityV1}/describe:
    get:
      summary: Describe a resource
      description: Returns the canonical presentation text of one resource by class code and durable identity-v1.
      parameters:
        - name: classCode
          in: path
          required: true
          schema: { type: string }
        - name: identityV1
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Resource description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDescription'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/resources/{id}:
    put:
      summary: Update a resource
      description: Replaces one existing resource's content by its internal id, obtained from a prior read, under optimistic concurrency.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceUpdateRequest'
      responses:
        '200':
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/resources/{id}/deactivate:
    post:
      summary: Deactivate a resource
      description: Deactivates one existing resource under optimistic concurrency.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceLifecycleRequest'
      responses:
        '200':
          description: Deactivated resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/resources/{id}/reactivate:
    post:
      summary: Reactivate a resource
      description: Reactivates one existing resource under optimistic concurrency.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceLifecycleRequest'
      responses:
        '200':
          description: Reactivated resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/types/{typeCode}/attributes/effective:
    get:
      summary: Resolve the static baseline attributes for a Tipo
      description: Returns the attributes applicable to one ResourceType with inheritance (Familia/Tipo) and presentation order already resolved by Core, evaluated against NO known values (the static baseline) — a CONDITIONAL attribute with no matching rule defaults to REQUIRED here. To resolve mode/options against real, already-known values, use POST .../attributes/evaluate instead. Never re-derive inheritance or rule defaults client-side.
      parameters:
        - name: typeCode
          in: path
          required: true
          schema: { type: string }
        - name: classCode
          in: query
          required: true
          schema: { type: string }
        - name: familyCode
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Resolved attribute view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveAttributesResponse'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/types/{typeCode}/attributes/order:
    get:
      summary: Get the effective attribute order for a Tipo
      description: Returns the authoritative committed per-Tipo visual order snapshot — the exact scope, the full ordered permutation, and an opaque OrderRevision. OrderRevision is never parsed or synthesized client-side; pass it back verbatim as expectedOrderRevision on the next write.
      parameters:
        - name: typeCode
          in: path
          required: true
          schema: { type: string }
        - name: classCode
          in: query
          required: true
          schema: { type: string }
        - name: familyCode
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Attribute order snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeOrderResponse'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    put:
      summary: Replace the effective attribute order for a Tipo
      description: Replaces one existing Tipo's effective attribute presentation order under optimistic concurrency. expectedOrderRevision must equal the OrderRevision most recently observed from GET (or a prior PUT result) for the exact same scope; orderedAttributes must be an exact permutation of that same snapshot's orderedAttributes. Actor is audit metadata, not authentication. The frontend never automatically retries a conflict.
      parameters:
        - name: typeCode
          in: path
          required: true
          schema: { type: string }
        - name: classCode
          in: query
          required: true
          schema: { type: string }
        - name: familyCode
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeOrderWriteRequest'
      responses:
        '200':
          description: Updated attribute order snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeOrderResponse'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/types/{typeCode}/attributes/evaluate:
    post:
      summary: Evaluate attributes for a Tipo against known values
      description: Same resolution as the effective-attributes GET, but with the caller's already-known values folded into CONDITIONAL rule evaluation and relation-narrowed allowed options — reuses Core's exact ResourceAttribute Effective/ValidOptions resolution. Never re-derive this client-side.
      parameters:
        - name: typeCode
          in: path
          required: true
          schema: { type: string }
        - name: classCode
          in: query
          required: true
          schema: { type: string }
        - name: familyCode
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateAttributesRequest'
      responses:
        '200':
          description: Resolved attribute view against the given values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveAttributesResponse'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/cfdi/parse:
    post:
      summary: Parse a CFDI 4.0 XML
      description: >-
        Reads one CFDI 4.0 voucher (Mexican electronic invoice) and returns all
        of its data. Nothing is stored. The XML may be uploaded as a multipart
        `file` field or sent as the raw request body. `supplierDraft` holds
        the Emisor shaped like a supplier create request, so a client can
        prefill a supplier form; `taxRegime` has no supplier field and is
        informational.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The CFDI XML file.
          application/xml:
            schema:
              type: string
              description: The raw CFDI XML document.
          text/xml:
            schema:
              type: string
              description: The raw CFDI XML document.
      responses:
        '200':
          description: Parsed voucher
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CFDIParseResponse'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '422':
          description: >-
            The file is not a usable CFDI 4.0. `code` is one of INVALID_XML,
            NOT_CFDI, UNSUPPORTED_VERSION, INVALID_CFDI.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/purchase-lines:
    get:
      summary: List the purchase-line workbench
      description: >-
        Returns the server-authoritative cross-document workbench, ordered by
        issuedAt descending and then lineId descending. `supplierSku` is the
        immutable XML supplier SKU evidence. Dates are inclusive calendar dates;
        dateTo includes the complete day. After a successful mutation, a
        conflict, or an ambiguous failure, reread this workbench rather than
        retrying blindly.
      parameters:
        - name: supplierId
          in: query
          schema: { type: string, pattern: '^[1-9][0-9]*$', maxLength: 19, description: 'Strict positive decimal supplier identifier; runtime rejects values exceeding int64 9223372036854775807.' }
        - name: status
          in: query
          schema: { type: string, enum: [PENDIENTE, VINCULADO, SUSPENDIDO, NO_APLICA, CONFLICTO] }
        - name: dateFrom
          in: query
          description: Inclusive CFDI issue date in YYYY-MM-DD format.
          schema: { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: dateTo
          in: query
          description: Inclusive CFDI issue date in YYYY-MM-DD format; the whole day is included.
          schema: { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: invoice
          in: query
          schema: { type: string }
        - name: supplierSku
          in: query
          description: Immutable supplier SKU copied from the purchase XML.
          schema: { type: string }
        - name: description
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Purchase-line workbench page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseLineWorkbenchPage'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/purchases:
    post:
      summary: Import a CFDI purchase document
      description: >-
        Imports one CFDI 4.0 purchase document from its raw XML, sent as
        multipart/form-data. Idempotent on the document's fiscal UUID:
        re-importing the same document returns 200 with alreadyExisted true
        and creates nothing; importing the same UUID with different content
        returns 409. If the Emisor RFC matches no existing supplier, a
        minimal supplier is auto-registered.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, actor]
              properties:
                file: { type: string, format: binary, description: The CFDI XML file. }
                actor: { type: string }
                branchId: { type: string, description: 'Optional strict positive decimal branch identifier; runtime rejects values exceeding int64 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19 }
      responses:
        '201':
          description: Purchase imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseImportResponse'
        '200':
          description: Purchase already existed with matching content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseImportResponse'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/purchases/{id}:
    get:
      summary: Get a purchase
      description: Returns one purchase by strict positive decimal identifier.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      responses:
        '200':
          description: Purchase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/purchases/by-uuid/{uuid}:
