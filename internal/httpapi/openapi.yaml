openapi: 3.0.3
info:
  title: Garfex API
  version: 0.1.0
  description: Public operational, API-reference, catalog-descriptor, catalog-list, and catalog-detail endpoints.
paths:
  /healthz:
    get:
      summary: Liveness probe
      description: Reports that this HTTP process is running. It does not check database or dependency readiness.
      responses:
        '200':
          description: Process is live
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
  /v1/catalog/descriptors:
    get:
      summary: List catalog descriptors
      description: Returns Core's dynamic catalog metadata. It does not list catalog records.
      responses:
        '200':
          description: Catalog descriptors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogDescriptorsResponse'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/catalog/classes:
    get:
      summary: List active classes
      description: Returns every active CLASE record, unpaginated.
      responses:
        '200':
          description: Active CLASE records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveClassesResponse'
        '500': { $ref: '#/components/responses/Internal' }
  /v1/catalog/{kind}:
    get:
      summary: List catalog records
      description: Returns a page of catalog records for one kind.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, ALL], default: ACTIVE }
        - name: text
          in: query
          schema: { type: string }
        - name: classCode
          in: query
          description: Scopes results to records whose parent CLASE has this code (e.g. listing FAMILIA or TIPO under one class). Silently ignored by a kind whose descriptor has no class parent field.
          schema: { type: string }
        - name: familyCode
          in: query
          description: Scopes results to records whose parent FAMILIA has this code (e.g. listing TIPO under one family). Silently ignored by a kind whose descriptor has no family parent field.
          schema: { type: string }
        - name: typeCode
          in: query
          description: Scopes results to records whose parent TIPO has this code (e.g. listing APLICABILIDAD or PRESENTACION under one type). Silently ignored by a kind whose descriptor has no type parent field.
          schema: { type: string }
        - name: optionSetCode
          in: query
          description: Scopes results to records whose parent CONJUNTO_OPCIONES has this code (e.g. listing OPCION under one option set). Silently ignored by a kind whose descriptor has no option-set parent field.
          schema: { type: string }
        - name: characteristicCode
          in: query
          description: Scopes results to records whose parent CARACTERISTICA has this code (e.g. listing APLICABILIDAD or OPCION under one characteristic). Silently ignored by a kind whose descriptor has no characteristic parent field.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Catalog records page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPage'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      summary: Create a catalog record
      description: Creates one catalog record of the requested kind.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogCreateRequest'
      responses:
        '201':
          description: Created catalog record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRecord'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/catalog/{kind}/{id}:
    get:
      summary: Get a catalog record
      description: Returns one catalog record by kind and strict positive decimal identifier.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      responses:
        '200':
          description: Catalog record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRecord'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
    put:
      summary: Update a catalog record
      description: Replaces one existing catalog record's content under optimistic concurrency.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogUpdateRequest'
      responses:
        '200':
          description: Updated catalog record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRecord'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
    delete:
      summary: Permanently delete a catalog record
      description: Irreversibly removes one existing catalog record under optimistic concurrency. Unlike deactivate, there is no idempotent no-op target and no record left to read back. The record must already be inactive (deactivate it first) — deleting an active record fails with 409 Conflict.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogLifecycleRequest'
      responses:
        '204':
          description: Catalog record permanently deleted
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/catalog/{kind}/{id}/deactivate:
    post:
      summary: Deactivate a catalog record
      description: Deactivates one existing catalog record under optimistic concurrency.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogLifecycleRequest'
      responses:
        '200':
          description: Deactivated catalog record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRecord'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/catalog/{kind}/{id}/reactivate:
    post:
      summary: Reactivate a catalog record
      description: Reactivates one existing catalog record under optimistic concurrency.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string }
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogLifecycleRequest'
      responses:
        '200':
          description: Reactivated catalog record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRecord'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/suppliers:
    get:
      summary: Search suppliers
      description: Returns a page of suppliers matching the query.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, ALL], default: ACTIVE }
        - name: text
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Supplier page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierPage'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      summary: Create a supplier
      description: Creates one supplier. Created suppliers are always active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierCreateRequest'
      responses:
        '201':
          description: Created supplier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/suppliers/{id}:
    get:
      summary: Get a supplier
      description: Returns one supplier by strict positive decimal identifier.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      responses:
        '200':
          description: Supplier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    put:
      summary: Update a supplier
      description: Fully replaces one existing supplier's content. A field left empty clears the stored value.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierUpdateRequest'
      responses:
        '200':
          description: Updated supplier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/suppliers/{id}/branches:
    get:
      summary: List branches
      description: Returns a page of branches belonging to one supplier.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
        - name: scope
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, ALL], default: ACTIVE }
        - name: text
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Branch page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchPage'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/suppliers/{id}/branches/{branchId}:
    get:
      summary: Get a branch
      description: Returns one branch belonging to one supplier.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
        - name: branchId
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      responses:
        '200':
          description: Branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/suppliers/{id}/contacts:
    get:
      summary: List contacts
      description: Returns a page of contacts belonging to one supplier, optionally narrowed to one branch.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
        - name: scope
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, ALL], default: ACTIVE }
        - name: text
          in: query
          schema: { type: string }
        - name: branchId
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Contact page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactPage'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/suppliers/{id}/contacts/{contactId}:
    get:
      summary: Get a contact
      description: Returns one contact belonging to one supplier.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
        - name: contactId
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      responses:
        '200':
          description: Contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/resources:
    get:
      summary: Search resources
      description: Returns a page of resources matching the query.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, ALL], default: ACTIVE }
        - name: text
          in: query
          schema: { type: string }
        - name: classCode
          in: query
          schema: { type: string }
        - name: familyCode
          in: query
          schema: { type: string }
        - name: typeCode
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Resource page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePage'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      summary: Create a resource
      description: Creates one resource under a class/family/type scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceCreateRequest'
      responses:
        '201':
          description: Created resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/resources/{classCode}/{identityV1}:
    get:
      summary: Get a resource
      description: Returns one resource by class code and durable identity-v1.
      parameters:
        - name: classCode
          in: path
          required: true
          schema: { type: string }
        - name: identityV1
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/resources/{classCode}/{identityV1}/describe:
    get:
      summary: Describe a resource
      description: Returns the canonical presentation text of one resource by class code and durable identity-v1.
      parameters:
        - name: classCode
          in: path
          required: true
          schema: { type: string }
        - name: identityV1
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Resource description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDescription'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/resources/{id}:
    put:
      summary: Update a resource
      description: Replaces one existing resource's content by its internal id, obtained from a prior read, under optimistic concurrency.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceUpdateRequest'
      responses:
        '200':
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/resources/{id}/deactivate:
    post:
      summary: Deactivate a resource
      description: Deactivates one existing resource under optimistic concurrency.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceLifecycleRequest'
      responses:
        '200':
          description: Deactivated resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/resources/{id}/reactivate:
    post:
      summary: Reactivate a resource
      description: Reactivates one existing resource under optimistic concurrency.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceLifecycleRequest'
      responses:
        '200':
          description: Reactivated resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/types/{typeCode}/attributes/effective:
    get:
      summary: Resolve the static baseline attributes for a Tipo
      description: Returns the attributes applicable to one ResourceType with inheritance (Familia/Tipo) and presentation order already resolved by Core, evaluated against NO known values (the static baseline) — a CONDITIONAL attribute with no matching rule defaults to REQUIRED here. To resolve mode/options against real, already-known values, use POST .../attributes/evaluate instead. Never re-derive inheritance or rule defaults client-side.
      parameters:
        - name: typeCode
          in: path
          required: true
          schema: { type: string }
        - name: classCode
          in: query
          required: true
          schema: { type: string }
        - name: familyCode
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Resolved attribute view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveAttributesResponse'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/types/{typeCode}/attributes/evaluate:
    post:
      summary: Evaluate attributes for a Tipo against known values
      description: Same resolution as the effective-attributes GET, but with the caller's already-known values folded into CONDITIONAL rule evaluation and relation-narrowed allowed options — reuses Core's exact ResourceAttribute Effective/ValidOptions resolution. Never re-derive this client-side.
      parameters:
        - name: typeCode
          in: path
          required: true
          schema: { type: string }
        - name: classCode
          in: query
          required: true
          schema: { type: string }
        - name: familyCode
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateAttributesRequest'
      responses:
        '200':
          description: Resolved attribute view against the given values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveAttributesResponse'
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '500': { $ref: '#/components/responses/Internal' }
  /openapi.yaml:
    get:
      summary: OpenAPI document
      responses:
        '200':
          description: Embedded OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string
  /docs:
    get:
      summary: API reference
      description: Serves a Scalar API-reference page for this OpenAPI document.
      responses:
        '200':
          description: HTML API-reference page
          content:
            text/html:
              schema:
                type: string
components:
  responses:
    InvalidArgument: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Requested resource was not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: Request conflicts with current state, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unprocessable: { description: Request failed validation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unavailable: { description: Service is temporarily unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Internal: { description: Internal server error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    CatalogRecord:
      type: object
      required: [kind, id, revision, active, values, rules]
      properties:
        kind: { type: string }
        id: { type: string, description: Decimal integer identifier, pattern: '^(?:0|-?[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        revision: { type: string, description: Decimal unsigned revision, pattern: '^(?:0|[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        active: { type: boolean }
        values: { type: object, additionalProperties: { $ref: '#/components/schemas/CatalogValue' } }
        rules: { type: array, items: { $ref: '#/components/schemas/ApplicabilityRule' } }
    CatalogPage:
      type: object
      required: [records, hasPrevious, hasNext]
      properties:
        records: { type: array, items: { $ref: '#/components/schemas/CatalogRecord' } }
        hasPrevious: { type: boolean }
        hasNext: { type: boolean }
    ApplicabilityRule:
      type: object
      required: [attributeCode, equals, mode, identityParticipates, notApplicable, active]
      properties:
        attributeCode: { type: string }
        equals: { $ref: '#/components/schemas/CatalogValue' }
        mode: { type: string }
        identityParticipates: { type: boolean }
        notApplicable: { type: boolean }
        active: { type: boolean }
    CatalogValue:
      oneOf:
        - { $ref: '#/components/schemas/CatalogTextValue' }
        - { $ref: '#/components/schemas/CatalogCodeValue' }
        - { $ref: '#/components/schemas/CatalogBooleanValue' }
        - { $ref: '#/components/schemas/CatalogIntegerValue' }
        - { $ref: '#/components/schemas/CatalogDecimalValue' }
        - { $ref: '#/components/schemas/CatalogQuantityValue' }
        - { $ref: '#/components/schemas/CatalogReferenceValue' }
        - { $ref: '#/components/schemas/CatalogEnumValue' }
        - { $ref: '#/components/schemas/CatalogStringListValue' }
        - { $ref: '#/components/schemas/CatalogControlledOptionValue' }
        - { $ref: '#/components/schemas/CatalogNotApplicableValue' }
      discriminator:
        propertyName: kind
        mapping:
          TEXT: '#/components/schemas/CatalogTextValue'
          CODE: '#/components/schemas/CatalogCodeValue'
          BOOLEAN: '#/components/schemas/CatalogBooleanValue'
          INTEGER: '#/components/schemas/CatalogIntegerValue'
          DECIMAL: '#/components/schemas/CatalogDecimalValue'
          QUANTITY: '#/components/schemas/CatalogQuantityValue'
          REFERENCE: '#/components/schemas/CatalogReferenceValue'
          ENUM: '#/components/schemas/CatalogEnumValue'
          STRING_LIST: '#/components/schemas/CatalogStringListValue'
          CONTROLLED_OPTION: '#/components/schemas/CatalogControlledOptionValue'
          NOT_APPLICABLE: '#/components/schemas/CatalogNotApplicableValue'
    CatalogTextValue:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties: { kind: { type: string, enum: [TEXT] }, value: { type: string } }
    CatalogCodeValue:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties: { kind: { type: string, enum: [CODE] }, value: { type: string } }
    CatalogBooleanValue:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties: { kind: { type: string, enum: [BOOLEAN] }, value: { type: boolean } }
    CatalogIntegerValue:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties: { kind: { type: string, enum: [INTEGER] }, value: { type: string, description: Decimal integer, pattern: '^(?:0|-?[1-9][0-9]*)$', not: { pattern: '[\r\n]' } } }
    CatalogDecimalValue:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties: { kind: { type: string, enum: [DECIMAL] }, value: { type: string, pattern: '^(?:0|-?(?:[1-9][0-9]*|(?:0|[1-9][0-9]*)\.[0-9]*[1-9]))$', not: { pattern: '[\r\n]' } } }
    CatalogQuantityValue:
      type: object
      additionalProperties: false
      required: [kind, value, unitCode]
      properties: { kind: { type: string, enum: [QUANTITY] }, value: { type: string, pattern: '^(?:0|-?(?:[1-9][0-9]*|(?:0|[1-9][0-9]*)\.[0-9]*[1-9]))$', not: { pattern: '[\r\n]' } }, unitCode: { type: string } }
    CatalogReferenceValue:
      type: object
      additionalProperties: false
      required: [kind, reference]
      properties: { kind: { type: string, enum: [REFERENCE] }, reference: { $ref: '#/components/schemas/CatalogReference' } }
    CatalogReference:
      type: object
      additionalProperties: false
      required: [kind, id, code]
      properties:
        kind: { type: string }
        id:
          type: string
          pattern: '^(?:0|-?[1-9][0-9]*)$'
          not: { pattern: '[\r\n]' }
          description: >-
            Decimal integer identifier. In a response this is the referenced
            record's real id. In a create/update request body it MUST be "0":
            the server resolves the reference by code, and a non-zero id is
            rejected as invalid (references are addressed by natural code on
            write, never by id).
        code: { type: string }
    CatalogEnumValue:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties: { kind: { type: string, enum: [ENUM] }, value: { type: string } }
    CatalogStringListValue:
      type: object
      additionalProperties: false
      required: [kind, values]
      properties: { kind: { type: string, enum: [STRING_LIST] }, values: { type: array, items: { type: string } } }
    CatalogControlledOptionValue:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties: { kind: { type: string, enum: [CONTROLLED_OPTION] }, value: { type: string } }
    CatalogNotApplicableValue:
      type: object
      additionalProperties: false
      required: [kind]
      properties: { kind: { type: string, enum: [NOT_APPLICABLE] } }
    CatalogCreateRequest:
      type: object
      additionalProperties: false
      required: [actor, values]
      properties:
        actor: { type: string }
        active: { type: boolean }
        values: { type: object, additionalProperties: { $ref: '#/components/schemas/CatalogValue' } }
        rules: { type: array, items: { $ref: '#/components/schemas/ApplicabilityRule' }, description: 'For kind APLICABILIDAD this field is required and must be present as an array even when the binding is non-conditional: omitting it fails with "applicability rules are omitted", and sending a non-empty array on a non-conditional binding fails with "non-conditional applicability has rules". Send an explicit empty array ([]) for the common non-conditional case.' }
    CatalogUpdateRequest:
      type: object
      additionalProperties: false
      required: [actor, expectedRevision, values]
      properties:
        actor: { type: string }
        expectedRevision: { type: string, description: Decimal unsigned revision, pattern: '^(?:0|[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        active: { type: boolean }
        values: { type: object, additionalProperties: { $ref: '#/components/schemas/CatalogValue' } }
        rules: { type: array, items: { $ref: '#/components/schemas/ApplicabilityRule' }, description: 'For kind APLICABILIDAD this field is required and must be present as an array even when the binding is non-conditional: omitting it fails with "applicability rules are omitted", and sending a non-empty array on a non-conditional binding fails with "non-conditional applicability has rules". Send an explicit empty array ([]) for the common non-conditional case.' }
    CatalogLifecycleRequest:
      type: object
      additionalProperties: false
      required: [actor, expectedRevision]
      properties:
        actor: { type: string }
        expectedRevision: { type: string, description: Decimal unsigned revision, pattern: '^(?:0|[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
    CatalogDescriptorsResponse:
      type: object
      required: [descriptors]
      properties: { descriptors: { type: array, items: { $ref: '#/components/schemas/CatalogDescriptor' } } }
    ActiveClassesResponse:
      type: object
      required: [records]
      properties: { records: { type: array, items: { $ref: '#/components/schemas/CatalogRecord' } } }
    CatalogDescriptor:
      type: object
      required: [kind, singular, plural, fields, identityFields, parentKind, parentField]
      properties:
        kind: { type: string }
        singular: { type: string }
        plural: { type: string }
        fields: { type: array, items: { $ref: '#/components/schemas/FieldDescriptor' } }
        identityFields: { type: array, items: { type: string } }
        parentKind: { type: string }
        parentField: { type: string }
    FieldDescriptor:
      type: object
      required: [name, label, kind, required, refKind, refScopedBy, allowCreate, enumValues]
      properties:
        name: { type: string }
        label: { type: string }
        kind: { type: string }
        required: { type: boolean }
        refKind: { type: string }
        refScopedBy: { type: array, items: { type: string } }
        allowCreate:
          type: boolean
          description: >-
            True on a reference field (refKind set) that should be presented
            as search-existing-first, create-as-fallback — never a plain
            "create new" form by default. Always false, and meaningless, on a
            non-reference field.
        enumValues: { type: array, items: { $ref: '#/components/schemas/EnumValue' } }
    EnumValue:
      type: object
      required: [value, label]
      properties: { value: { type: string }, label: { type: string } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: 'Generic, sanitized classification of the failure (e.g. "invalid request", "validation failed").'
        code:
          type: string
          description: >-
            Stable, machine-readable reason code, safe to switch on: distinct
            outcomes that read the same generic "conflict" error (e.g. an
            expected-revision mismatch, a still-active record, or a record
            still in use) are always distinguishable here even when error is
            identical. Absent only when the failure never reached Core (e.g.
            an HTTP method mismatch).
          enum:
            - INVALID_ARGUMENT
            - NOT_FOUND
            - DUPLICATE
            - INVALID_REFERENCE
            - VALIDATION
            - INTEGRITY
            - IDENTITY_CONFLICT
            - INVALID_LIFECYCLE
            - REACTIVATION_IMPOSSIBLE
            - INVALID_CATALOG
            - IN_USE
            - IMMUTABLE_CODE
            - CONFLICT
            - UNAVAILABLE
            - INTERNAL
        detail:
          type: string
          description: >-
            The specific reason, present only when error is "invalid request" or
            "validation failed". Absent for every other error (not found, conflict,
            unavailable, internal server error), which never expose internal detail.
    SupplierCreateRequest:
      type: object
      additionalProperties: false
      required: [actor]
      properties:
        actor: { type: string }
        tradeName: { type: string }
        legalName: { type: string }
        taxIdentifier: { type: string }
        website: { type: string }
        notes: { type: string }
    SupplierUpdateRequest:
      type: object
      additionalProperties: false
      required: [actor]
      properties:
        actor: { type: string }
        tradeName: { type: string }
        legalName: { type: string }
        taxIdentifier: { type: string }
        website: { type: string }
        notes: { type: string }
    Supplier:
      type: object
      additionalProperties: false
      required: [id, tradeName, legalName, taxIdentifier, website, notes, active, createdAt, updatedAt]
      properties:
        id: { type: string, description: Decimal integer identifier, pattern: '^(?:0|-?[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        tradeName: { type: string }
        legalName: { type: string }
        taxIdentifier: { type: string }
        website: { type: string }
        notes: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SupplierPage:
      type: object
      additionalProperties: false
      required: [suppliers, hasPrevious, hasNext]
      properties:
        suppliers: { type: array, items: { $ref: '#/components/schemas/Supplier' } }
        hasPrevious: { type: boolean }
        hasNext: { type: boolean }
    Branch:
      type: object
      additionalProperties: false
      required: [id, supplierId, name, reference, city, state, country, address, generalPhone, generalEmail, notes, active, createdAt, updatedAt]
      properties:
        id: { type: string, description: Decimal integer identifier, pattern: '^(?:0|-?[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        supplierId: { type: string, description: Decimal integer identifier, pattern: '^(?:0|-?[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        name: { type: string }
        reference: { type: string }
        city: { type: string }
        state: { type: string }
        country: { type: string }
        address: { type: string }
        generalPhone: { type: string }
        generalEmail: { type: string }
        notes: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BranchPage:
      type: object
      additionalProperties: false
      required: [branches, hasPrevious, hasNext]
      properties:
        branches: { type: array, items: { $ref: '#/components/schemas/Branch' } }
        hasPrevious: { type: boolean }
        hasNext: { type: boolean }
    Contact:
      type: object
      additionalProperties: false
      required: [id, supplierId, name, role, phone, mobile, email, notes, active, createdAt, updatedAt]
      properties:
        id: { type: string, description: Decimal integer identifier, pattern: '^(?:0|-?[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        supplierId: { type: string, description: Decimal integer identifier, pattern: '^(?:0|-?[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        branchId: { type: string, description: Decimal integer identifier; omitted when the contact has no branch, pattern: '^(?:0|-?[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        name: { type: string }
        role: { type: string }
        phone: { type: string }
        mobile: { type: string }
        email: { type: string }
        notes: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ContactPage:
      type: object
      additionalProperties: false
      required: [contacts, hasPrevious, hasNext]
      properties:
        contacts: { type: array, items: { $ref: '#/components/schemas/Contact' } }
        hasPrevious: { type: boolean }
        hasNext: { type: boolean }
    ResourceScope:
      type: object
      additionalProperties: false
      required: [classCode, familyCode, typeCode]
      properties:
        classCode: { type: string }
        familyCode: { type: string }
        typeCode: { type: string }
    ResourceAttribute:
      type: object
      additionalProperties: false
      required: [code, value]
      properties:
        code: { type: string }
        value: { $ref: '#/components/schemas/CatalogValue' }
    ResourceCreateRequest:
      type: object
      additionalProperties: false
      required: [actor, scope, naturalUnit, attributes]
      properties:
        actor: { type: string }
        scope: { $ref: '#/components/schemas/ResourceScope' }
        naturalUnit: { type: string }
        attributes: { type: array, items: { $ref: '#/components/schemas/ResourceAttribute' } }
    ResourceUpdateRequest:
      type: object
      additionalProperties: false
      required: [actor, expectedRevision, scope, naturalUnit, attributes]
      properties:
        actor: { type: string }
        expectedRevision: { type: string, description: Decimal unsigned revision, pattern: '^(?:0|[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        scope: { $ref: '#/components/schemas/ResourceScope' }
        naturalUnit: { type: string }
        attributes: { type: array, items: { $ref: '#/components/schemas/ResourceAttribute' } }
    ResourceLifecycleRequest:
      type: object
      additionalProperties: false
      required: [actor, expectedRevision]
      properties:
        actor: { type: string }
        expectedRevision: { type: string, description: Decimal unsigned revision, pattern: '^(?:0|[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
    Resource:
      type: object
      additionalProperties: false
      required: [id, identityV1, scope, naturalUnit, active, revision, attributes]
      properties:
        id: { type: string, description: Decimal integer identifier, pattern: '^(?:0|-?[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        identityV1: { type: string }
        scope: { $ref: '#/components/schemas/ResourceScope' }
        naturalUnit: { type: string }
        active: { type: boolean }
        revision: { type: string, description: Decimal unsigned revision, pattern: '^(?:0|[1-9][0-9]*)$', not: { pattern: '[\r\n]' } }
        attributes: { type: array, items: { $ref: '#/components/schemas/ResourceAttribute' } }
    ResourcePage:
      type: object
      additionalProperties: false
      required: [resources, hasPrevious, hasNext]
      properties:
        resources: { type: array, items: { $ref: '#/components/schemas/Resource' } }
        hasPrevious: { type: boolean }
        hasNext: { type: boolean }
    ResourceDescription:
      type: object
      additionalProperties: false
      required: [description]
      properties:
        description: { type: string }
    CharacteristicDescriptor:
      type: object
      required: [code, name, valueType]
      properties:
        code: { type: string }
        name: { type: string }
        valueType: { type: string }
        dimension: { type: string }
    EffectiveAttributeSource:
      type: object
      required: [level, code]
      properties:
        level: { type: string, enum: [FAMILY, TYPE] }
        code: { type: string }
    EffectiveAttributeOption:
      type: object
      required: [code, label]
      properties:
        code: { type: string }
        label: { type: string }
    EffectiveAttribute:
      type: object
      required: [characteristic, effectiveMode, identityParticipates, notApplicable, position, hasPosition, source, rules, options]
      properties:
        characteristic: { $ref: '#/components/schemas/CharacteristicDescriptor' }
        effectiveMode: { type: string }
        identityParticipates: { type: boolean }
        notApplicable: { type: boolean }
        position: { type: integer }
        hasPosition: { type: boolean, description: 'false means position is a placeholder zero — no PresentationField is configured for this attribute.' }
        optionSetCode: { type: string }
        source: { $ref: '#/components/schemas/EffectiveAttributeSource' }
        rules: { type: array, items: { $ref: '#/components/schemas/ApplicabilityRule' } }
        options: { type: array, items: { $ref: '#/components/schemas/EffectiveAttributeOption' }, description: 'Allowed values, narrowed by AttributeOptionRelation against whatever values were provided (unconstrained on the effective GET, since it provides none; narrowed on evaluate). Empty for non-option attributes.' }
    EffectiveAttributesResponse:
      type: object
      required: [typeCode, attributes]
      properties:
        typeCode: { type: string }
        attributes: { type: array, items: { $ref: '#/components/schemas/EffectiveAttribute' } }
    EvaluateAttributesRequest:
      type: object
      additionalProperties: false
      required: [values]
      properties:
        values: { type: array, items: { $ref: '#/components/schemas/ResourceAttribute' } }
