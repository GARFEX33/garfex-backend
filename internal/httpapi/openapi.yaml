  /v1/supplier-products/{id}/mapping/confirm:
    post:
      summary: Confirm a supplier-product mapping
      description: >-
        Conditionally confirms the selected active Resource for this
        SupplierProduct. The expected mapping revision is authoritative; after
        success, conflict, or an ambiguous failure, reread the SupplierProduct
        and do not retry blindly.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmMappingRequest' }
      responses:
        '200':
          description: Authoritative SupplierProduct after the transition.
          content: { application/json: { schema: { $ref: '#/components/schemas/SupplierProduct' } } }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404':
          description: SupplierProduct or selected Resource was not found (`NOT_FOUND`, `RESOURCE_NOT_FOUND`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: Conditional transition failed (`STALE_MAPPING_REVISION`, `INVALID_MAPPING_TRANSITION`, or `INTEGRITY_CONFLICT`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: Selected Resource cannot be used (`RESOURCE_INACTIVE` or `VALIDATION`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/supplier-products/{id}/mapping/correct:
    post:
      summary: Correct a supplier-product mapping
      description: >-
        Replaces the current Resource only when both the expected current
        Resource and mapping revision match. Reread after every result; this
        operation is not a blind-idempotent retry contract.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectMappingRequest' }
      responses:
        '200':
          description: Authoritative SupplierProduct after the transition.
          content: { application/json: { schema: { $ref: '#/components/schemas/SupplierProduct' } } }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404':
          description: SupplierProduct or selected Resource was not found (`NOT_FOUND`, `RESOURCE_NOT_FOUND`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: Conditional transition failed (`STALE_MAPPING_REVISION`, `INVALID_MAPPING_TRANSITION`, or `INTEGRITY_CONFLICT`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: Selected Resource cannot be used (`RESOURCE_INACTIVE` or `VALIDATION`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/supplier-products/{id}/mapping/retire:
    post:
      summary: Retire a supplier-product mapping
      description: >-
        Removes the current mapping only when the expected current Resource and
        mapping revision match. Reread after success, conflict, or ambiguous
        failure; do not retry blindly.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetireMappingRequest' }
      responses:
        '200':
          description: Authoritative SupplierProduct after the transition.
          content: { application/json: { schema: { $ref: '#/components/schemas/SupplierProduct' } } }
        '400': { $ref: '#/components/responses/InvalidArgument' }
        '404':
          description: SupplierProduct or selected Resource was not found (`NOT_FOUND`, `RESOURCE_NOT_FOUND`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: Conditional transition failed (`STALE_MAPPING_REVISION`, `INVALID_MAPPING_TRANSITION`, or `INTEGRITY_CONFLICT`).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500': { $ref: '#/components/responses/Internal' }
  /v1/supplier-products/{id}/mapping/report-conflict:
    post:
      summary: Report a supplier-product identity conflict
      description: >-
        Records an identity conflict after checking the expected current
        Resource and mapping revision. Reread after any result and never retry
        an ambiguous failure blindly.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: 'Strict positive decimal identifier; the runtime rejects values exceeding the int64 boundary 9223372036854775807.', pattern: '^[1-9][0-9]*$', maxLength: 19, not: { pattern: '[\r\n]' } }
      requestBody:
