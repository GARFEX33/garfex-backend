services:
  db:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      GARFEX_ADMIN_PASSWORD: ${GARFEX_ADMIN_PASSWORD:?GARFEX_ADMIN_PASSWORD must be set}
      GARFEX_APP_PASSWORD: ${GARFEX_APP_PASSWORD:?GARFEX_APP_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - garfex_pgdata:/var/lib/postgresql/data
      - ./scripts/db/init/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  garfex_pgdata:
    name: ${GARFEX_DB_VOLUME_NAME:-garfex_backend_pgdata}
